<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudySpot interactive T-prototype</title><style>body{font:16px system-ui;background:#e9eff5;color:#17344b;margin:0;display:grid;place-items:center;min-height:100vh}.phone{background:white;width:min(410px,95vw);min-height:690px;border:8px solid #17344b;border-radius:34px;overflow:hidden;box-shadow:0 12px 35px #6784a055}header{background:#143d64;color:white;padding:23px;font-size:25px;font-weight:800}main{padding:22px;min-height:510px}h2{margin:0 0 20px}.card{background:#eef6fa;border:1px solid #c8dce8;border-radius:15px;padding:17px;margin:12px 0}.card p{margin:7px 0;color:#486075}button{background:#007e91;color:white;border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer;margin:4px}button:focus-visible{outline:3px solid orange}nav{display:flex;justify-content:space-around;background:#e3edf4;padding:13px}nav button{font-size:13px}label{display:block;margin:13px 0}select,input{padding:12px;width:100%;box-sizing:border-box}small{color:#42576b}</style><div class="phone"><header>StudySpot</header><main id="main" aria-live="polite"></main><nav><button onclick="go('home')">Home</button><button onclick="go('rooms')">Rooms</button><button onclick="go('bookings')">Bookings</button></nav></div><script>let page='home',chosen='Library Room A',date='2026-11-20',time='14:00',booking=null;const el=document.querySelector('#main');function go(x){page=x;render()}function render(){let s='';if(page==='home')s=`<h2>Find your study space</h2><p>Quiet rooms, without the guesswork.</p><div class="card"><h3>Find a room</h3><p>Search by capacity, features, and time.</p><button onclick="go('rooms')">Browse rooms</button></div><div class="card"><h3>My bookings</h3><button onclick="go('bookings')">View bookings</button></div>`;if(page==='rooms')s=`<h2>Available Rooms</h2><label>Group size <select id="size" onchange="renderRooms()"><option value="4">4 people</option><option value="2">2 people</option><option value="6">6 people</option></select></label><div id="results"></div>`;if(page==='details')s=`<h2>${chosen}</h2><div class="card"><h3>Room details</h3><p>Seats: ${chosen==='Library Room B'?6:chosen==='Learning Hub C'?2:4}</p><p>Features: ${chosen==='Library Room B'?'Accessible entrance, whiteboard':chosen==='Learning Hub C'?'Monitor, power outlets':'Whiteboard, power outlets'}</p></div><button onclick="go('time')">Choose a time</button>`;if(page==='time')s=`<h2>Select a time</h2><p>${chosen}</p><label>Date<input id="date" type="date" value="${date}" min="2026-11-12" onchange="date=this.value"></label><label>Start time<select onchange="time=this.value"><option value="14:00">2:00 PM</option><option value="15:00">3:00 PM</option><option value="16:00">4:00 PM</option></select></label><p>Duration: 1 hour</p><button onclick="booking={room:chosen,date,time};go('confirmation')">Confirm reservation</button>`;if(page==='confirmation')s=`<h2>✓ Reservation confirmed</h2><div class="card"><h3>${booking.room}</h3><p>${booking.date} at ${booking.time} for 1 hour</p><p>Confirmation: DEMO-001</p></div><button onclick="go('bookings')">Manage booking</button>`;if(page==='bookings')s=`<h2>My Bookings</h2>${booking?`<div class="card"><h3>${booking.room}</h3><p>${booking.date} at ${booking.time}</p><button onclick="booking=null;render()">Cancel reservation</button></div>`:'<p>No upcoming reservations.</p>'}<button onclick="go('rooms')">Find a room</button>`;el.innerHTML=s;if(page==='rooms')renderRooms()}function renderRooms(){let size=document.querySelector('#size').value;let data=[['Library Room A',4,'Whiteboard'],['Library Room B',6,'Accessible'],['Learning Hub C',2,'Monitor']].filter(r=>r[1]>=Number(size));document.querySelector('#results').innerHTML=data.map(r=>`<div class="card"><h3>${r[0]}</h3><p>${r[1]} seats • ${r[2]}</p><button onclick="chosen='${r[0]}';go('details')">View details</button></div>`).join('')||'<p>No rooms match this group size.</p>'}render()</script></html>
